<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algoritmos y Programación Básica</title>
<style>
  :root { --bg: #14151D; --card: #1E2030; --text: #F4F0E6; --soft: #B4B8CC; --if: #6EA8FF; --loop: #FF9F43; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.1; margin: 0 0 8px; }
  .sub { color: var(--soft); margin: 0 0 40px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
  a { display: block; padding: 24px; border-radius: 16px; background: var(--card); border: 2px solid transparent; color: inherit; text-decoration: none; }
  a:hover, a:focus-visible { border-color: var(--loop); }
  .tag { font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--if); }
  .name { display: block; font-size: 24px; font-weight: 700; margin-top: 4px; }
  .desc { display: block; color: var(--soft); margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Algoritmos y Programación Básica</h1>
  <p class="sub">Presentaciones de clase</p>
  <ul>
    <li>
      <a href="clases/decisiones-y-bucles/">
        <span class="tag">Presentación</span>
        <span class="name">Decisiones y Bucles</span>
        <span class="desc">SI y MIENTRAS con diagramas de flujo, sin código.</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
